<!-- The split's own name, currency, and the two actions that used to sit in
     the app-wide header, shown on every tab — moved here since only this one
     needs them. -->
<div class="split-header">
  <input
    class="title-input"
    type="text"
    placeholder="Name this split"
    aria-label="Split title"
    [value]="store.title()"
    (input)="onTitle($event)"
  />
  <app-currency-picker
    class="currency-select"
    label="Base currency"
    [value]="store.baseCurrency()"
    (changed)="store.setBaseCurrency($event)"
  />
  <span class="split-header-actions">
    <button
      class="btn"
      type="button"
      title="Download this split as a JSON file"
      (click)="exportActive()"
    >
      Export
    </button>
    <button class="btn" type="button" (click)="newSplit()">New split</button>
  </span>
</div>

<ag-grid-angular
  class="grid"
  [theme]="theme"
  [rowData]="rows()"
  [columnDefs]="columns()"
  [pinnedTopRowData]="pinnedTop()"
  (gridReady)="onGridReady($event)"
  (modelUpdated)="onModelUpdated()"
  (cellMouseDown)="onCellMouseDown($event)"
  (cellMouseOver)="onCellMouseOver($event)"
  (columnMoved)="onColumnMoved($event)"
  [getRowId]="getRowId"
  [defaultColDef]="defaultColDef"
  [enableCellSpan]="true"
  [stopEditingWhenCellsLoseFocus]="true"
  [animateRows]="false"
  [getRowClass]="getRowClass"
  [rowSelection]="rowSelection"
  (selectionChanged)="onSelectionChanged($event)"
  [rowHeight]="rowHeight"
  [getRowHeight]="getRowHeight"
  [headerHeight]="82"
/>

@if (editingSheetId(); as sheetId) {
  <div class="editor-backdrop" (click)="closeEditor()"></div>
  <app-sheet-editor
    class="editor-panel"
    [sheetId]="sheetId"
    (closed)="closeEditor()"
    (keydown.escape)="closeEditor()"
  />
}

<!-- What used to be a toolbar of three buttons, shown once lines were
     ticked. AG Grid's own context menu is Enterprise, so a right-click opens
     this one instead — see `onContextMenu`, on the host. -->
@if (contextMenuPos(); as pos) {
  <div
    class="context-menu-backdrop"
    (click)="closeContextMenu()"
    (contextmenu)="$event.preventDefault(); closeContextMenu()"
  ></div>
  <div class="context-menu" [style.left.px]="pos.x" [style.top.px]="pos.y">
    <span class="context-menu-count">
      {{ ticked().length === 1 ? '1 line ticked' : ticked().length + ' lines ticked' }}
    </span>
    <button
      class="btn ghost"
      type="button"
      title="Give everyone an equal share of the ticked lines"
      (click)="splitTickedEvenly(); closeContextMenu()"
    >
      Everyone
    </button>
    <button
      class="btn ghost"
      type="button"
      title="Clear the ticked lines' shares, keeping the lines"
      (click)="clearTickedShares(); closeContextMenu()"
    >
      Clear shares
    </button>
    <button class="btn danger" type="button" (click)="removeTicked(); closeContextMenu()">
      Remove {{ ticked().length === 1 ? 'line' : ticked().length + ' lines' }}
    </button>
  </div>
}
