<header class="topbar">
  <div class="topbar-inner">
    <!--
      The split's own name, currency, total and export used to live here,
      shown on every tab — the name, currency and export now sit above the
      grid on the Split tab, the only one that needs them, and the total was
      dropped for being redundant with the grid's own. This input is what is
      left: the splits panel reaches for it by template reference and clicks
      it, so it has to live somewhere in this template regardless of which
      tab is open.
    -->
    <input
      #importInput
      class="visually-hidden"
      type="file"
      accept="application/json,.json"
      aria-label="Import splits from a JSON file"
      (change)="importFile($event)"
    />

    <nav class="tabs" id="topbar-menu">
      @for (t of tabs; track t.id) {
        <button
          class="tab"
          type="button"
          [class.active]="tab() === t.id"
          (click)="select(t.id)"
        >
          {{ t.label }}
          @if (t.id === 'split' && errorCount()) {
            <span class="badge">{{ errorCount() }}</span>
          }
        </button>
      }
    </nav>
  </div>
</header>

<main>
  @switch (tab()) {
    @case ('splits') {
      <app-splits-panel
        [importError]="importError()"
        [importNotice]="importNotice()"
        (importErrorDismissed)="dismissImportError()"
        (importNoticeDismissed)="dismissImportNotice()"
        (opened)="select('split')"
        (exportRequested)="exportSplits([$event])"
        (exportAllRequested)="exportAll()"
        (importRequested)="importInput.click()"
      />
    }
    @case ('split') {
      <app-split-grid />
    }
    @case ('help') {
      <app-help-panel />
    }
  }
</main>

<div class="alerts-overlay">
  @if (driveImportPending()) {
    <div class="alert info" role="status">
      <span>Opening file from Google Drive…</span>
    </div>
  } @else if (driveImportError(); as message) {
    <div class="alert conflict with-actions" role="alert">
      <span>{{ message }}</span>
      <span class="alert-actions">
        <button class="btn" type="button" (click)="dismissDriveImportError()">Dismiss</button>
      </span>
    </div>
  }
</div>
