<header class="topbar">
  <div class="topbar-inner">
    <nav class="tabs" id="topbar-menu">
      @for (t of tabs; track t.path) {
        <a class="tab" [routerLink]="t.path" routerLinkActive="active">
          {{ t.label }}
          @if (t.path === '/split' && errorCount()) {
            <span class="badge">{{ errorCount() }}</span>
          }
        </a>
      }
    </nav>
  </div>
</header>

<main>
  <router-outlet />
</main>
